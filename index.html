<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Camera Grid</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body { touch-action: none; }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: none;
  }

  #status {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(244, 241, 234, 0.5);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
  }
  #status[hidden] { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "leva": "https://esm.sh/leva@0.10.0?external=react,react-dom"
  }
}
</script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="status">Waiting for camera</div>
  <div id="controls"></div>

<script type="module">
const canvas = document.getElementById('stage');
const statusEl = document.getElementById('status');
const fail = msg => { statusEl.hidden = false; statusEl.textContent = msg; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- starting values ---- */
// radius and source reach are fractions of the screen's short side, so the
// disturbance keeps its size whatever the tile size
const DEFAULTS = {
  density: 72, gap: 0, gridLines: 0.055, mosaic: true, shuffle: 2,
  push: 32, reach: 0.1, carry: 0.15, swirl: 0, fullSpeed: 10,
  spring: 0.07, damping: 0.86, fade: 0.55,
  srcStrength: 3, srcRate: 0.5, srcWave: 6, srcReach: 0.14, srcSwirl: 0,
};

/* ---- presets: saved looks; each sets every look-shaping parameter ---- */
const PRESETS = {
  drift: {
    density: 28, gap: 1, gridLines: 0.06, mosaic: true, shuffle: 2,
    push: 120, reach: 0.6, carry: 0, swirl: 0, fullSpeed: 6,
    spring: 0.01, damping: 0.57, fade: 1,
    srcStrength: 6, srcRate: 0.3, srcWave: 8, srcReach: 0.5, srcSwirl: 0,
  },
  whirl: {
    density: 246, gap: 1, gridLines: 0.06, mosaic: true, shuffle: 2,
    push: 120, reach: 1.5, carry: 0.33, swirl: 3.1, fullSpeed: 1,
    spring: 0.01, damping: 0.92, fade: 0,
    srcStrength: 6, srcRate: 0.3, srcWave: 8, srcReach: 0.5, srcSwirl: 0,
  },
};

/* ---- live parameters; the leva panel writes into this ---- */
const params = { ...DEFAULTS, mirror: true, cursor: true };

/* ---- perturbation sources, placed by clicking a cell ---- */
const MAX_SOURCES = 16;
const sources = [];   // { x, y } in screen css px (a cell centre), born in seconds
const clearSources = () => { sources.length = 0; };

/* ---- shared uniform block (152 bytes, padded to 160) ---- */
const UNIFORMS = /* wgsl */ `
  struct U {
    res: vec2f,      // css px
    off: vec2f,      // grid phase
    pointer: vec2f,  // css px, in feed space (mirrored when the feed is)
    vOff: vec2f,     // cover-fit crop, video px
    vSize: vec2f,    // video px
    vel: vec2f,      // smoothed pointer velocity, feed-space css px / frame
    cell: f32,
    cols: f32,
    count: f32,
    engaged: f32,
    inset: f32,
    dpr: f32,
    vScale: f32,
    energy: f32,     // 0 when the pointer is still, ~1 on a fast drag
    push: f32,
    reach: f32,      // css px
    carry: f32,
    spring: f32,
    damping: f32,
    fade: f32,
    gridLines: f32,
    mirror: f32,
    cursor: f32,
    swirl: f32,      // already sign-corrected for mirroring
    srcCount: f32,
    srcStrength: f32,
    srcRate: f32,    // waves per second
    srcWave: f32,    // wavelength, in cells
    srcReach: f32,   // css px
    srcSwirl: f32,   // already sign-corrected for mirroring
    mosaic: f32,     // 1: every cell holds exactly one tile
  };
  struct Tile { pos: vec2f, vel: vec2f };
  // xy: feed-space centre, z: age in seconds
  struct Sources { s: array<vec4f, ${MAX_SOURCES}> };

  const INK = vec3f(244.0, 241.0, 234.0) / 255.0;
  const TAU = 6.2831853;

  fn homeOf(i: u32) -> vec2f {
    let cols = u32(u.cols);
    return u.off + vec2f(f32(i % cols), f32(i / cols)) * u.cell;
  }
  fn snapToGrid(p: vec2f) -> vec2f {
    return round((p - u.off) / u.cell) * u.cell + u.off;
  }
  fn cellOf(p: vec2f) -> vec2f {
    return floor((p - u.off) / u.cell) * u.cell + u.off;
  }
  // feed space -> screen x, flipping when mirrored
  fn screenX(x: f32) -> f32 {
    return select(x, u.res.x - x, u.mirror > 0.5);
  }
  // perpendicular, clockwise on screen when not mirrored (y points down)
  fn perp(d: vec2f) -> vec2f {
    return vec2f(-d.y, d.x);
  }
`;

/* ---- physics: same spring / push as hello, one thread per tile ---- */
const COMPUTE = /* wgsl */ `
  @group(0) @binding(0) var<uniform> u: U;
  @group(0) @binding(1) var<storage, read_write> tiles: array<Tile>;
  @group(0) @binding(2) var<uniform> src: Sources;
  ${UNIFORMS}

  @compute @workgroup_size(64)
  fn main(@builtin(global_invocation_id) id: vec3u) {
    let i = id.x;
    if (i >= u32(u.count)) { return; }
    var t = tiles[i];
    let centre = t.pos + u.cell * 0.5;

    // only a moving pointer disturbs the grid, so a resting one lets it heal
    if (u.engaged > 0.5 && u.energy > 0.001) {
      // push from the tile's centre so the wake is symmetric round the cursor
      let d = centre - u.pointer;
      let dist = max(length(d), 0.001);
      let radius = u.reach;
      if (dist < radius) {
        let falloff = pow(1.0 - dist / radius, 2.0);
        let dir = d / dist;
        t.vel += (dir + perp(dir) * u.swirl) * (falloff * u.push * u.energy);
        // and carry tiles along the stroke, shuffling them into other cells
        t.vel += u.vel * falloff * u.carry;
      }
    }

    // sources send out waves that keep rolling while the pointer rests
    for (var k = 0u; k < u32(u.srcCount); k++) {
      let s = src.s[k];
      let d = centre - s.xy;
      let dist = max(length(d), 0.001);
      let radius = u.srcReach;
      if (dist < radius) {
        let falloff = pow(1.0 - dist / radius, 2.0);
        let dir = d / dist;
        // ease each source in over its first half second
        let wave = sin(TAU * (s.z * u.srcRate - dist / (u.cell * u.srcWave))) * min(s.z * 2.0, 1.0);
        t.vel += (dir * wave + perp(dir) * u.srcSwirl) * (falloff * u.srcStrength);
      }
    }

    t.vel += (homeOf(i) - t.pos) * u.spring;
    t.vel *= u.damping;
    t.pos += t.vel;
    tiles[i] = t;
  }
`;

/* ---- mosaic: the physics says where each tile wants to be; neighbouring
   cells swap tiles whenever that brings both closer. Swaps keep the mapping a
   permutation, so every cell always holds exactly one tile and nothing shows
   through. Alternating row / column, even / odd pairs keeps pairs disjoint. ---- */
const SWAP = /* wgsl */ `
  @group(0) @binding(0) var<uniform> u: U;
  @group(0) @binding(1) var<storage, read> tiles: array<Tile>;
  @group(0) @binding(2) var<storage, read_write> slots: array<u32>;   // cell -> tile
  @group(0) @binding(3) var<uniform> swapStep: vec4f;   // x: axis (0 rows, 1 columns), y: parity
  ${UNIFORMS}

  // quartic term breaks the ties squared distance leaves, e.g. diagonal swaps
  fn cost(want: vec2f, at: vec2f) -> f32 {
    let d = (want - at) / u.cell;
    let d2 = dot(d, d);
    return d2 + 0.1 * d2 * d2;
  }

  @compute @workgroup_size(64)
  fn main(@builtin(global_invocation_id) id: vec3u) {
    let cols = u32(u.cols);
    let rows = u32(u.count) / cols;
    let parity = u32(swapStep.y);
    var a: u32;
    var b: u32;
    if (swapStep.x < 0.5) {
      let perRow = (cols - parity) / 2u;
      if (id.x >= rows * perRow) { return; }
      a = (id.x / perRow) * cols + (id.x % perRow) * 2u + parity;
      b = a + 1u;
    } else {
      let perCol = (rows - parity) / 2u;
      if (id.x >= cols * perCol) { return; }
      a = ((id.x / cols) * 2u + parity) * cols + id.x % cols;
      b = a + cols;
    }

    let ta = slots[a];
    let tb = slots[b];
    let wa = tiles[ta].pos;
    let wb = tiles[tb].pos;
    let ca = homeOf(a);
    let cb = homeOf(b);
    if (cost(wa, cb) + cost(wb, ca) < cost(wa, ca) + cost(wb, cb) - 1e-4) {
      slots[a] = tb;
      slots[b] = ta;
    }
  }
`;

/* ---- tiles: instanced quads, drawn snapped to the grid, sampling their home patch ---- */
const TILES = /* wgsl */ `
  @group(0) @binding(0) var<uniform> u: U;
  @group(0) @binding(1) var<storage, read> tiles: array<Tile>;
  @group(0) @binding(2) var samp: sampler;
  @group(0) @binding(3) var feed: texture_external;
  @group(0) @binding(4) var<uniform> layer: vec4f;   // x: 0 = tiles at home, 1 = displaced
  @group(0) @binding(5) var<storage, read> slots: array<u32>;
  ${UNIFORMS}

  struct VOut {
    @builtin(position) pos: vec4f,
    @location(0) uv: vec2f,
    @location(1) alpha: f32,
  };

  @vertex
  fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
    var quad = array<vec2f, 6>(
      vec2f(0, 0), vec2f(1, 0), vec2f(0, 1),
      vec2f(0, 1), vec2f(1, 0), vec2f(1, 1),
    );
    var out: VOut;

    let mosaic = u.mosaic > 0.5;
    // mosaic: instance = cell, drawn in place, showing whichever tile it holds.
    // free: instance = tile, drifting freely but only ever *drawn* in a grid cell
    let home = select(homeOf(ii), homeOf(slots[ii]), mosaic);
    let g = select(snapToGrid(tiles[ii].pos), homeOf(ii), mosaic);
    let d = g - home;
    let moved = dot(d, d) > 0.25;

    // free mode draws two layers so displaced tiles sit on top of the ones at
    // home; mosaic tiles never overlap, so it draws everything in the first
    if (select(moved != (layer.x > 0.5), layer.x > 0.5, mosaic)) {
      out.pos = vec4f(2.0, 2.0, 0.0, 1.0);
      return out;
    }

    let q = quad[vi];
    let size = u.cell - 2.0 * u.inset;
    let p = g + u.inset + q * size;
    let src = home + u.inset + q * size;

    out.uv = (src / u.vScale + u.vOff) / u.vSize;
    out.pos = vec4f(2.0 * screenX(p.x) / u.res.x - 1.0, 1.0 - 2.0 * p.y / u.res.y, 0.0, 1.0);
    out.alpha = select(1.0, 1.0 - min(length(d) / u.cell / 14.0, u.fade), moved);
    return out;
  }

  @fragment
  fn fs(in: VOut) -> @location(0) vec4f {
    return vec4f(textureSampleBaseClampToEdge(feed, samp, in.uv).rgb, in.alpha);
  }
`;

/* ---- full-screen passes: the faint grid underneath, cursor and sources on top ---- */
const OVERLAY = /* wgsl */ `
  @group(0) @binding(0) var<uniform> u: U;
  @group(0) @binding(1) var<uniform> src: Sources;
  ${UNIFORMS}

  @vertex
  fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
    let p = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u));
    return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  }

  fn feedSpace(fp: vec4f) -> vec2f {
    return vec2f(screenX(fp.x / u.dpr), fp.y / u.dpr);
  }

  @fragment
  fn grid(@builtin(position) fp: vec4f) -> @location(0) vec4f {
    let k = (feedSpace(fp) - u.off) / u.cell;
    let dist = abs(k - round(k)) * u.cell;
    let on = min(dist.x, dist.y) < 0.5;
    return vec4f(INK * select(0.0, u.gridLines, on), 1.0);
  }

  @fragment
  fn overlay(@builtin(position) fp: vec4f) -> @location(0) vec4f {
    let css = feedSpace(fp);

    // each source is a small square in its cell, breathing with its wave
    for (var k = 0u; k < u32(u.srcCount); k++) {
      let s = src.s[k];
      let l = abs(css - (cellOf(s.xy) + u.cell * 0.5));
      if (max(l.x, l.y) < max(1.5, u.cell * 0.16)) {
        return vec4f(INK, 0.55 + 0.35 * sin(TAU * s.z * u.srcRate));
      }
    }

    if (u.engaged < 0.5 || u.cursor < 0.5) { discard; }
    let l = css - cellOf(u.pointer);
    let edge = min(min(l.x, l.y), min(u.cell - l.x, u.cell - l.y));
    if (edge < 0.0 || edge > 1.0) { discard; }
    return vec4f(INK, 0.6);
  }
`;

async function main() {
  if (!navigator.gpu) return fail('WebGPU not available in this browser');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) return fail('No WebGPU adapter');
  const device = await adapter.requestDevice();
  device.lost.then(info => fail(`GPU lost: ${info.message}`));

  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });

  /* ---- camera ---- */
  const video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    await video.play();
    statusEl.hidden = true;
  } catch (err) {
    return fail(`Camera unavailable (${err.name})`);
  }

  /* ---- pipelines ---- */
  const blend = {
    color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' },
    alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' },
  };
  const computeModule = device.createShaderModule({ code: COMPUTE });
  const swapModule = device.createShaderModule({ code: SWAP });
  const tileModule = device.createShaderModule({ code: TILES });
  const overlayModule = device.createShaderModule({ code: OVERLAY });

  const physics = device.createComputePipeline({
    layout: 'auto',
    compute: { module: computeModule, entryPoint: 'main' },
  });
  const swapper = device.createComputePipeline({
    layout: 'auto',
    compute: { module: swapModule, entryPoint: 'main' },
  });
  const render = (module, vs, fs, withBlend) => device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: vs },
    fragment: { module, entryPoint: fs, targets: [{ format, blend: withBlend ? blend : undefined }] },
    primitive: { topology: 'triangle-list' },
  });
  const tilePipe = render(tileModule, 'vs', 'fs', true);
  const gridPipe = render(overlayModule, 'vs', 'grid', false);
  const overlayPipe = render(overlayModule, 'vs', 'overlay', true);

  const uniformData = new Float32Array(40);
  const uniformBuf = device.createBuffer({ size: uniformData.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const sourceData = new Float32Array(MAX_SOURCES * 4);
  const sourceBuf = device.createBuffer({ size: sourceData.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const layerBufs = [0, 1].map(v => {
    const buf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, new Float32Array([v, 0, 0, 0]));
    return buf;
  });
  // the four swap steps: rows even / odd, then columns even / odd
  const swapSteps = [[0, 0], [0, 1], [1, 0], [1, 1]].map(([axis, parity]) => {
    const buf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, new Float32Array([axis, parity, 0, 0]));
    return buf;
  });
  const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });

  const gridBind = device.createBindGroup({
    layout: gridPipe.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: uniformBuf } }],
  });
  const overlayBind = device.createBindGroup({
    layout: overlayPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniformBuf } },
      { binding: 1, resource: { buffer: sourceBuf } },
    ],
  });

  /* ---- layout: size the grid, centre it, give every cell a tile ---- */
  let W = 0, H = 0, dpr = 1, cell = 0, cols = 0, rows = 0, offX = 0, offY = 0, count = 0;
  let laidOut = '';
  let tileBuf, slotBuf, physicsBind, swapBinds;

  const layout = () => {
    W = innerWidth;
    H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    // the gap widens the pitch rather than eating into the tile
    cell = Math.max(3, Math.round(Math.min(W, H) / params.density)) + params.gap;
    cols = Math.ceil(W / cell);
    rows = Math.ceil(H / cell);
    offX = (W - cols * cell) / 2;
    offY = (H - rows * cell) / 2;
    count = cols * rows;

    const init = new Float32Array(count * 4);
    for (let i = 0; i < count; i++) {
      init[i * 4]     = offX + (i % cols) * cell;
      init[i * 4 + 1] = offY + Math.floor(i / cols) * cell;
    }
    tileBuf?.destroy();
    tileBuf = device.createBuffer({ size: init.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(tileBuf, 0, init);

    // every cell starts holding its own tile
    slotBuf?.destroy();
    slotBuf = device.createBuffer({ size: count * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(slotBuf, 0, Uint32Array.from({ length: count }, (_, i) => i));
    swapBinds = swapSteps.map(stepBuf => device.createBindGroup({
      layout: swapper.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuf } },
        { binding: 1, resource: { buffer: tileBuf } },
        { binding: 2, resource: { buffer: slotBuf } },
        { binding: 3, resource: { buffer: stepBuf } },
      ],
    }));

    physicsBind = device.createBindGroup({
      layout: physics.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuf } },
        { binding: 1, resource: { buffer: tileBuf } },
        { binding: 2, resource: { buffer: sourceBuf } },
      ],
    });
    laidOut = layoutKey();
  };
  // rebuild whenever the window or a grid-shaping control changes
  const layoutKey = () => `${innerWidth}x${innerHeight}@${Math.min(devicePixelRatio || 1, 2)}:${params.density}/${params.gap}`;

  const toFeedX = x => params.mirror ? W - x : x;

  /* ---- pointer, tracked on the canvas so using the panel leaves the grid alone ---- */
  const pointer = { x: 0, y: 0, active: false };
  canvas.addEventListener('pointermove', e => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  }, { passive: true });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; });

  // click a cell to drop a source there; click it again to remove it.
  // placed on release, and only if the pointer barely moved, so drags don't drop one
  let press = null;
  canvas.addEventListener('pointerdown', e => {
    if (e.button === 0) press = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', e => {
    if (!press || Math.hypot(e.clientX - press.x, e.clientY - press.y) > 4) { press = null; return; }
    press = null;
    const fx = toFeedX(e.clientX);
    const cx = Math.floor((fx - offX) / cell) * cell + offX + cell / 2;
    const cy = Math.floor((e.clientY - offY) / cell) * cell + offY + cell / 2;
    const x = toFeedX(cx);
    const hit = sources.findIndex(s => Math.abs(s.x - x) < cell / 2 && Math.abs(s.y - cy) < cell / 2);
    if (hit >= 0) sources.splice(hit, 1);
    else {
      if (sources.length === MAX_SOURCES) sources.shift();
      sources.push({ x, y: cy, born: performance.now() / 1000 });
    }
  });

  /* ---- pointer motion, smoothed so pointer events and frames needn't line up ---- */
  const motion = { lastX: 0, lastY: 0, vx: 0, vy: 0, seen: false };
  const trackMotion = () => {
    if (!pointer.active) { motion.seen = false; motion.vx = motion.vy = 0; return 0; }
    const dx = motion.seen ? pointer.x - motion.lastX : 0;
    const dy = motion.seen ? pointer.y - motion.lastY : 0;
    motion.lastX = pointer.x;
    motion.lastY = pointer.y;
    motion.seen = true;
    motion.vx = motion.vx * 0.75 + dx * 0.25;
    motion.vy = motion.vy * 0.75 + dy * 0.25;
    return Math.min(Math.hypot(motion.vx, motion.vy) / params.fullSpeed, 1.5);
  };

  /* ---- frame ---- */
  const frame = () => {
    if (layoutKey() !== laidOut) layout();

    const now = performance.now() / 1000;
    const energy = trackMotion();
    // mirroring flips x, so flip velocity and spin with it
    const flip = params.mirror ? -1 : 1;
    const vw = video.videoWidth, vh = video.videoHeight;
    const ready = video.readyState >= 2 && vw > 0;
    const vScale = ready ? Math.max(W / vw, H / vh) : 1;
    const srcCount = reduced ? 0 : sources.length;

    uniformData.set([
      W, H,
      offX, offY,
      toFeedX(pointer.x), pointer.y,
      ready ? (vw - W / vScale) / 2 : 0, ready ? (vh - H / vScale) / 2 : 0,
      vw || 1, vh || 1,
      motion.vx * flip, motion.vy,
      cell, cols, count,
      pointer.active && !reduced ? 1 : 0,
      params.gap / 2,
      dpr,
      vScale,
      energy,
      params.push, params.reach * Math.min(W, H), params.carry,
      params.spring, params.damping, params.fade,
      params.gridLines,
      params.mirror ? 1 : 0,
      params.cursor ? 1 : 0,
      params.swirl * flip,
      srcCount,
      params.srcStrength, params.srcRate, params.srcWave, params.srcReach * Math.min(W, H),
      params.srcSwirl * flip,
      params.mosaic ? 1 : 0,
    ]);
    device.queue.writeBuffer(uniformBuf, 0, uniformData);

    sources.forEach((s, k) => sourceData.set([toFeedX(s.x), s.y, now - s.born, 0], k * 4));
    device.queue.writeBuffer(sourceBuf, 0, sourceData);

    const enc = device.createCommandEncoder();

    const cp = enc.beginComputePass();
    cp.setPipeline(physics);
    cp.setBindGroup(0, physicsBind);
    cp.dispatchWorkgroups(Math.ceil(count / 64));
    if (params.mosaic) {
      // each round lets a tile slide at most one cell along each axis
      cp.setPipeline(swapper);
      for (let r = 0; r < params.shuffle; r++) {
        for (const bind of swapBinds) {
          cp.setBindGroup(0, bind);
          cp.dispatchWorkgroups(Math.ceil(count / 2 / 64));
        }
      }
    }
    cp.end();

    const rp = enc.beginRenderPass({
      colorAttachments: [{
        view: ctx.getCurrentTexture().createView(),
        clearValue: [0, 0, 0, 1],
        loadOp: 'clear',
        storeOp: 'store',
      }],
    });

    rp.setPipeline(gridPipe);
    rp.setBindGroup(0, gridBind);
    rp.draw(3);

    if (ready) {
      // external textures expire every frame, so their bind groups do too
      const feed = device.importExternalTexture({ source: video });
      rp.setPipeline(tilePipe);
      for (const layerBuf of layerBufs) {
        rp.setBindGroup(0, device.createBindGroup({
          layout: tilePipe.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: { buffer: uniformBuf } },
            { binding: 1, resource: { buffer: tileBuf } },
            { binding: 2, resource: sampler },
            { binding: 3, resource: feed },
            { binding: 4, resource: { buffer: layerBuf } },
            { binding: 5, resource: { buffer: slotBuf } },
          ],
        }));
        rp.draw(6, count);
      }
    }

    rp.setPipeline(overlayPipe);
    rp.setBindGroup(0, overlayBind);
    rp.draw(3);
    rp.end();

    device.queue.submit([enc.finish()]);
    requestAnimationFrame(frame);
  };

  layout();
  requestAnimationFrame(frame);
}

/* ---- controls: a leva panel, loaded separately so the sketch runs without it ---- */
async function mountControls() {
  const [React, { createRoot }, { Leva, useControls, folder, button, buttonGroup }] = await Promise.all([
    import('react'), import('react-dom/client'), import('leva'),
  ]);
  const h = React.createElement;
  const GAP_STEPS = [0, 1, 5];

  function Controls() {
    const [hidden, setHidden] = React.useState(false);
    const setRef = React.useRef(null);
    const applyPreset = name => setRef.current?.(PRESETS[name]);

    const [values, set] = useControls(() => ({
      preset: buttonGroup(
        Object.fromEntries(Object.keys(PRESETS).map(name => [name, () => applyPreset(name)]))
      ),
      grid: folder({
        density: { value: params.density, min: 8, max: 300, step: 1, label: 'tiles' },
        gap: { value: params.gap, min: 0, max: 10, step: 1, label: 'gap px' },
        gridLines: { value: params.gridLines, min: 0, max: 0.4, step: 0.005, label: 'grid lines' },
        mosaic: { value: params.mosaic, label: 'mosaic' },
        shuffle: { value: params.shuffle, min: 1, max: 8, step: 1, label: 'shuffle speed', render: get => get('grid.mosaic') },
        mirror: params.mirror,
        cursor: { value: params.cursor, label: 'cursor cell' },
      }),
      motion: folder({
        push: { value: params.push, min: 0, max: 200, step: 1 },
        reach: { value: params.reach, min: 0.02, max: 1.5, step: 0.01, label: 'radius' },
        swirl: { value: params.swirl, min: -5, max: 5, step: 0.1 },
        carry: { value: params.carry, min: 0, max: 1, step: 0.01 },
        fullSpeed: { value: params.fullSpeed, min: 1, max: 40, step: 0.5, label: 'full speed' },
        spring: { value: params.spring, min: 0.001, max: 0.3, step: 0.001 },
        damping: { value: params.damping, min: 0.3, max: 0.99, step: 0.01 },
        fade: { value: params.fade, min: 0, max: 1, step: 0.01, label: 'trail fade' },
      }),
      sources: folder({
        srcStrength: { value: params.srcStrength, min: 0, max: 20, step: 0.1, label: 'strength' },
        srcRate: { value: params.srcRate, min: 0, max: 3, step: 0.05, label: 'waves / s' },
        srcWave: { value: params.srcWave, min: 1, max: 30, step: 0.5, label: 'wavelength' },
        srcReach: { value: params.srcReach, min: 0.02, max: 1.5, step: 0.01, label: 'radius' },
        srcSwirl: { value: params.srcSwirl, min: -5, max: 5, step: 0.1, label: 'swirl' },
        'clear (c)': button(clearSources),
      }),
    }));
    setRef.current = set;

    // the frame loop reads params every frame, so this is all the wiring it needs
    Object.assign(params, values);

    // keyboard shortcuts go through leva so the panel stays in sync
    React.useEffect(() => {
      const onKey = e => {
        if (e.target.closest?.('input, textarea')) return;
        if (e.key === ']') set({ density: Math.min(Math.round(params.density * 1.25), 300) });
        else if (e.key === '[') set({ density: Math.max(Math.round(params.density / 1.25), 8) });
        else if (e.key === 'g') {
          const i = GAP_STEPS.indexOf(params.gap);
          set({ gap: GAP_STEPS[(i + 1) % GAP_STEPS.length] });
        }
        else if (e.key === 'c') clearSources();
        else if (e.key === 'h') setHidden(v => !v);
      };
      addEventListener('keydown', onKey);
      return () => removeEventListener('keydown', onKey);
    }, [set]);

    return h(Leva, { hidden, titleBar: { title: 'camera grid · h to hide' } });
  }

  createRoot(document.getElementById('controls')).render(h(Controls));
}

main().catch(err => { console.error(err); fail(err.message); });
mountControls().catch(err => console.warn('controls unavailable', err));
</script>
